<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kuwait Analytics Hub</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=29">
</head>
<body class="login-page">
  <main class="login-card">
    <div class="login-brand">
      <div class="brand-mark login-brand-mark">
        <span class="brand-icon" aria-hidden="true">
          <svg viewBox="0 0 40 40" fill="none">
            <circle cx="20" cy="20" r="17" stroke="url(#goldRingLogin)" stroke-width="2.4"/>
            <circle cx="20" cy="20" r="10.5" stroke="url(#goldRingLogin)" stroke-width="1.6" opacity=".7"/>
            <path d="M20 4c5 4 8 9.5 8 16s-3 12-8 16" stroke="url(#goldRingLogin)" stroke-width="1.4" opacity=".55"/>
            <defs>
              <linearGradient id="goldRingLogin" x1="2" y1="2" x2="38" y2="38" gradientUnits="userSpaceOnUse">
                <stop offset="0" stop-color="#f4bc3d"/>
                <stop offset="1" stop-color="#a9740f"/>
              </linearGradient>
            </defs>
          </svg>
        </span>
        <span class="brand-wordmark">
          <strong>AL ANSARI EXCHANGE</strong>
        </span>
      </div>
      <p class="eyebrow">INTERNAL ANALYTICS</p>
      <h1>Kuwait Analytics Hub</h1>
    </div>

    <p class="subtitle">Sign in to access your authorised dashboards.</p>

    <label for="email">Email address</label>
    <input id="email" type="email" placeholder="name@company.com" autocomplete="username">

    <label for="password">Password</label>
    <div class="password-wrap">
      <input id="password" type="password" placeholder="Enter your password" autocomplete="current-password">
      <button id="toggle-password" class="text-button" type="button">Show</button>
    </div>

    <button id="login-button" class="primary-button" type="button">Sign in</button>
    <p id="login-message" class="error-message" role="alert"></p>
  </main>

  <script type="module" src="auth.js?v=8"></script>
</body>
</html>
